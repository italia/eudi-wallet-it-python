# Flake8: fail only on critical (E9,F63,F7,F82,T100). Style (E,W,F) reported
# with exit-zero in CI via second run with --extend-select=E,W,F.
[flake8]
max-line-length = 160
select = E9,F63,F7,F82,T100
# W503: line break before binary operator (Black style). E501: long lines in test data.
extend-ignore = W503,E501
exclude = .git,__pycache__,build,dist,.eggs
per-file-ignores = __init__.py:F401
