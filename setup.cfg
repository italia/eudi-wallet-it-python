# Flake8: fail on syntax/undefined (E9,F63,F7,F82,T100); warn on style (exit-zero)
# Used by CI and linting.sh so options are not repeated in workflows.
[flake8]
max-line-length = 160
select = E9,F63,F7,F82,T100
extend-select = E,W,F
exclude = .git,__pycache__,build,dist,.eggs
per-file-ignores = __init__.py:F401
