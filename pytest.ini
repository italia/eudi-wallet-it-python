# pytest.ini or .pytest.ini
[pytest]
log_file = logs/temp_convertor_tests_run.log
log_file_date_format = %Y-%m-%d %H:%M:%S
log_file_format = %(asctime)s - %(name)s %(levelname)s %(message)s
log_file_level = DEBUG
minversion = 6.0
# Run tests in a single process (no parallelism). Reduces MongoDB connection pressure
# and avoids "connection closed" / AutoReconnect under load.
addopts = -ra -q -p no:xdist
testpaths =
    pyeudiw
markers =
    no_attestation_mock: opt out of the autouse OAuth client attestation validation mock